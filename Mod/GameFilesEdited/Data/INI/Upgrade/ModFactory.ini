; MOD: Factory modules. OBJECT upgrades, so every factory picks its own module, once.
; The effects live on the factory in Object/FactionBuilding.ini; the buttons are in
; CommandButton/ModFactory.ini. Costs and times are first playtest values.

;------------------------------------------------------------------------------
; USA - War Factory
;------------------------------------------------------------------------------
Upgrade Upgrade_ModFactoryUSALogistics
  DisplayName        = UPGRADE:ModFactoryUSALogistics
  Type               = OBJECT
  BuildTime          = 30.0
  BuildCost          = 750
  ButtonImage        = SAsupplyline
End

Upgrade Upgrade_ModFactoryUSAAdvanced
  DisplayName        = UPGRADE:ModFactoryUSAAdvanced
  Type               = OBJECT
  BuildTime          = 30.0
  BuildCost          = 1000
  ButtonImage        = SAUplink
End
