; MOD: Doctrine buttons. NOT_QUEUEABLE keeps a doctrine from being queued while anything else is in
; the building's production queue, so the two doctrines can never be researched at the same time.

CommandButton Command_ModDoctrineUSANetwork
  Command          = PLAYER_UPGRADE
  Upgrade          = Upgrade_ModDoctrineUSANetwork
  Options          = NOT_QUEUEABLE
  TextLabel        = CONTROLBAR:ModUpgradeDoctrineUSANetwork
  ButtonImage      = SAScout
  ButtonBorderType = UPGRADE
  DescriptLabel    = CONTROLBAR:ModTooltipDoctrineUSANetwork
End

