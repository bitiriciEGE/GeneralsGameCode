; MOD: Factory module buttons. NOT_QUEUEABLE: a module can only be installed while the factory's
; queue is empty, so the two modules can never be researched at the same time.

CommandButton Command_ModFactoryUSALogistics
  Command          = OBJECT_UPGRADE
  Upgrade          = Upgrade_ModFactoryUSALogistics
  Options          = NOT_QUEUEABLE
  TextLabel        = CONTROLBAR:ModUpgradeFactoryUSALogistics
  ButtonImage      = SAsupplyline
  ButtonBorderType = UPGRADE
  DescriptLabel    = CONTROLBAR:ModTooltipFactoryUSALogistics
End

CommandButton Command_ModFactoryUSAAdvanced
  Command          = OBJECT_UPGRADE
  Upgrade          = Upgrade_ModFactoryUSAAdvanced
  Options          = NOT_QUEUEABLE
  TextLabel        = CONTROLBAR:ModUpgradeFactoryUSAAdvanced
  ButtonImage      = SAUplink
  ButtonBorderType = UPGRADE
  DescriptLabel    = CONTROLBAR:ModTooltipFactoryUSAAdvanced
End
