; MOD: Weapons of the scout units (Object/ModScoutUnits.ini).

; Forward Observer laser designator. Same mechanism as the Avenger's AvengerTargetDesignator: it puts the
; FAERIE_FIRE status on the target, and everything shooting at a FAERIE_FIRE target fires faster
; (GameData.ini: WeaponBonus = TARGET_FAERIE_FIRE RATE_OF_FIRE 150%). The status lasts PrimaryDamage msec,
; so a target stays marked for 10 seconds after the observer stops designating.
Weapon ModForwardObserverDesignator
  PrimaryDamage       = 10000.0     ; how long (msec) the target stays marked
  PrimaryDamageRadius = 0.0
  AttackRange         = 300.0
  DamageType          = STATUS
  DamageStatusType    = FAERIE_FIRE
  WeaponSpeed         = 999999.0
  DelayBetweenShots   = 200
  ClipSize            = 0
  ClipReloadTime      = 0
  LaserName           = AvengerTargetingLaserBeam
  LaserBoneName       = Muzzle      ; bone of the Pathfinder model
  FireFX              = WeaponFX_AvengerTargetDesignator
  FireSound           = AvengerPaintWeaponLoop
  FireSoundLoopTime   = 120
End
