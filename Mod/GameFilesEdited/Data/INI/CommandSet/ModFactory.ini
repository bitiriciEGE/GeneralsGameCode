; MOD: Command sets of factories with modules. The base set leaves the slots of the advanced
; vehicles (2, 5, 8) empty; Advanced Systems fills them, Logistics keeps them empty.

;------------------------------------------------------------------------------
; USA - War Factory (vanilla: AmericaWarFactoryCommandSet)
;------------------------------------------------------------------------------
CommandSet ModAmericaWarFactoryCommandSet
  1  = Command_ConstructAmericaTankCrusader
  3  = Command_ConstructAmericaVehicleHumvee
  4  = Command_ConstructAmericaVehicleMedic
  6  = Command_ConstructAmericaVehicleSentryDrone
  7  = Command_ConstructAmericaVehicleAvenger
  9  = Command_UpgradeAmericaSentryDroneGun
  10 = Command_ModFactoryUSALogistics
  11 = Command_UpgradeAmericaTOWMissile
  12 = Command_ModFactoryUSAAdvanced
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

CommandSet ModAmericaWarFactoryCommandSetLogistics
  1  = Command_ConstructAmericaTankCrusader
  3  = Command_ConstructAmericaVehicleHumvee
  4  = Command_ConstructAmericaVehicleMedic
  6  = Command_ConstructAmericaVehicleSentryDrone
  7  = Command_ConstructAmericaVehicleAvenger
  9  = Command_UpgradeAmericaSentryDroneGun
  10 = Command_ModFactoryUSALogistics
  11 = Command_UpgradeAmericaTOWMissile
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

CommandSet ModAmericaWarFactoryCommandSetAdvanced
  1  = Command_ConstructAmericaTankCrusader
  2  = Command_ConstructAmericaVehicleTomahawk
  3  = Command_ConstructAmericaVehicleHumvee
  4  = Command_ConstructAmericaVehicleMedic
  5  = Command_ConstructAmericaVehiclePaladin
  6  = Command_ConstructAmericaVehicleSentryDrone
  7  = Command_ConstructAmericaVehicleAvenger
  8  = Command_ConstructAmericaVehicleMicrowave
  9  = Command_UpgradeAmericaSentryDroneGun
  11 = Command_UpgradeAmericaTOWMissile
  12 = Command_ModFactoryUSAAdvanced
  13 = Command_SetRallyPoint
  14 = Command_Sell
End
