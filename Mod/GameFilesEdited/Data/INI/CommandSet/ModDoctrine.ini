; MOD: Command sets of the doctrine buildings. The base sets are the vanilla ones plus both doctrine
; buttons; after a doctrine is chosen, CommandSetUpgrade switches to a set that keeps only the
; chosen doctrine (shown as purchased) and drops the other.

