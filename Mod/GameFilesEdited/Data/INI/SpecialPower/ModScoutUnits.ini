; MOD: Special powers of the scout units (Object/ModScoutUnits.ini).

; China Mobile Surveillance Vehicle: the GLA Radar Van scan (OCL SUPERWEAPON_RadarVanScan) with a longer
; reload and no upgrade needed.
SpecialPower ModSpecialPowerChinaSurveillanceSweep
  Enum                    = SPECIAL_RADAR_VAN_SCAN
  ReloadTime              = 45000   ; in milliseconds
  PublicTimer             = No
  InitiateAtLocationSound = RadarVanScan
  RadiusCursorRadius      = 150     ; matches the RadarVanPing object's ShroudClearingRange
  ShortcutPower           = No
End
